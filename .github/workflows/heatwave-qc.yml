name: Heatwave QC independent-project tests
on:
  push:
    paths:
      - 'projects/heatwave-qc-policy-benchmark/**'
      - '.github/workflows/heatwave-qc.yml'
  pull_request:
    paths:
      - 'projects/heatwave-qc-policy-benchmark/**'
      - '.github/workflows/heatwave-qc.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/heatwave-qc-policy-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic end-to-end smoke test (NOT science)
        run: python run.py --mode demo --stations 3 --reps 2
